# Stages the package on npm, with provenance, when a GitHub release is published. A maintainer then
# approves the staged version with 2FA (npm stage approve, or on npmjs.com) to publish it.
# Authenticates with npm trusted publishing: the trust relationship for this repository and workflow
# on npmjs.com needs the "npm stage publish" permission; no npm token is stored here.
# Run it by hand (workflow_dispatch) to stage the version in package.json on main again.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm stage publish --provenance --access public
